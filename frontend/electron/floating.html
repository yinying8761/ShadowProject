<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI Companion</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 64px;
        height: 64px;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #icon {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        overflow: hidden;
        cursor: pointer;
        background: linear-gradient(135deg, rgba(124,111,240,0.7), rgba(236,90,146,0.7));
        border: 2px solid rgba(255,255,255,0.55);
        box-shadow: 0 4px 16px rgba(0,0,0,0.45);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      #icon:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 24px rgba(124,111,240,0.6);
      }
      #icon:active {
        transform: scale(0.95);
      }
      #avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      #avatar-fallback {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.95);
        font-size: 28px;
        font-weight: 600;
        pointer-events: none;
      }
      #pulse {
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.4);
        animation: pulse 2s ease-out infinite;
        pointer-events: none;
        transition: border-color 0.3s, box-shadow 0.3s;
      }
      #pulse.unread {
        border-color: rgba(239,68,68,0.95);
        box-shadow: 0 0 12px rgba(239,68,68,0.6), 0 0 24px rgba(239,68,68,0.3);
        animation: pulse-unread 0.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      @keyframes pulse-unread {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.35); opacity: 0.5; }
      }
      #icon.unread-glow {
        box-shadow: 0 0 16px rgba(239,68,68,0.55), 0 0 32px rgba(239,68,68,0.25);
        border-color: rgba(239,68,68,0.7);
      }
    </style>
  </head>
  <body>
    <div id="icon">
      <span id="avatar-fallback">AI</span>
      <img id="avatar-img" style="display:none" alt="" />
      <div id="pulse"></div>
    </div>
    <script>
      const fallback = document.getElementById('avatar-fallback');
      const img = document.getElementById('avatar-img');
      const icon = document.getElementById('icon');

      // JS-driven drag: mousedown records origin. mousemove computes TOTAL
      // displacement from origin and sends it to main process. Main process
      // stores the window position at drag start and applies the total delta,
      // so there is zero cumulative drift.
      let dragState = null;

      icon.addEventListener('mousedown', (e) => {
        dragState = {
          startX: e.screenX,
          startY: e.screenY,
          startT: Date.now(),
          dragging: false,
        };
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragState) return;
        const totalDx = e.screenX - dragState.startX;
        const totalDy = e.screenY - dragState.startY;
        if (!dragState.dragging && (Math.abs(totalDx) > 4 || Math.abs(totalDy) > 4)) {
          dragState.dragging = true;
        }
        if (dragState.dragging) {
          window.floatingAPI?.dragMove(totalDx, totalDy);
        }
      });

      window.addEventListener('mouseup', () => {
        if (!dragState) return;
        const dt = Date.now() - dragState.startT;
        const wasDragging = dragState.dragging;
        dragState = null;
        window.floatingAPI?.dragEnd();
        if (!wasDragging && dt < 250) {
          window.floatingAPI?.restore();
        }
      });

      window.floatingAPI?.onAvatar((info) => {
        if (info?.url) {
          img.src = info.url;
          img.style.display = 'block';
          fallback.style.display = 'none';
        } else {
          img.style.display = 'none';
          fallback.style.display = 'flex';
          fallback.textContent = info?.initial || 'AI';
        }
      });

      window.floatingAPI?.onUnread((info) => {
        const pulse = document.getElementById('pulse');
        const unread = Boolean(info?.unread);
        if (unread) {
          pulse.style.animation = 'none';
          void pulse.offsetWidth;
          pulse.style.animation = 'pulse-unread 0.8s ease-in-out infinite';
          pulse.style.borderColor = 'rgba(239,68,68,0.95)';
          pulse.style.boxShadow = '0 0 14px rgba(239,68,68,0.7), 0 0 28px rgba(239,68,68,0.35)';
          icon.style.boxShadow = '0 0 18px rgba(239,68,68,0.5), 0 0 36px rgba(239,68,68,0.2)';
          icon.style.borderColor = 'rgba(239,68,68,0.85)';
        } else {
          pulse.style.animation = 'none';
          void pulse.offsetWidth;
          pulse.style.animation = 'pulse 2s ease-out infinite';
          pulse.style.borderColor = 'rgba(255,255,255,0.4)';
          pulse.style.boxShadow = 'none';
          icon.style.boxShadow = '0 4px 16px rgba(0,0,0,0.45)';
          icon.style.borderColor = 'rgba(255,255,255,0.55)';
        }
      });
    </script>
  </body>
</html>
